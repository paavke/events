server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy → Apiman (Apiman remains the real API gateway)
    location /apiman-gateway/ {
        proxy_pass http://apiman:8080/apiman-gateway/;
        include /etc/nginx/proxy_params.conf;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Optional: Apiman Manager UI via frontend host
    location /apimanui/ {
        proxy_pass http://apiman:8080/apimanui/;
        include /etc/nginx/proxy_params.conf;
    }
    location /apiman/ {
        proxy_pass http://apiman:8080/apiman/;
        include /etc/nginx/proxy_params.conf;
    }

    # WebSocket / SockJS (not via Apiman)
    location /ws {
        proxy_pass http://event-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        include /etc/nginx/proxy_params.conf;
        proxy_read_timeout 86400;
    }
}
